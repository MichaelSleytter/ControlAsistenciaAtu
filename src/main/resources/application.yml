server:
  # Render/Railway/etc. inyectan su propio PORT; en local usamos SERVER_PORT (o 8080).
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: asistencias-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:asistencias_atu}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-your-env-file-min-32-chars}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.atu.asistencias: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
